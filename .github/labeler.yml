# Configuration de actions/labeler, référencée par .github/workflows/label.yml.
#
# Syntaxe v5 : chaque étiquette porte une liste de règles, et un glob se déclare
# via `changed-files` / `any-glob-to-any-file`. La v4 acceptait une simple liste
# de globs — les deux formats ne sont pas interchangeables.
#
# Rappel : le workflow est déclenché par `pull_request_target`, donc l'action lit
# CE fichier depuis la branche de base. Une modification n'a d'effet qu'une fois
# fusionnée dans master.

contenu:
  - changed-files:
      - any-glob-to-any-file: "src/content/**"

i18n:
  - changed-files:
      - any-glob-to-any-file:
          - "messages/**"
          - "project.inlang/**"
          - "src/scripts/compile-i18n.mts"
          - "src/lib/i18n.ts"

app:
  - changed-files:
      - any-glob-to-any-file: "src/app/**"

ui:
  - changed-files:
      - any-glob-to-any-file:
          - "src/components/**"
          - "src/hooks/**"

registry:
  - changed-files:
      - any-glob-to-any-file:
          - "src/registry/**"
          - "src/scripts/build-registry.mts"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "e2e/**"
          - "src/**/*.test.ts"
          - "vitest.config.ts"
          - "vitest.setup.ts"
          - "playwright.config.ts"

dépendances:
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "pnpm-lock.yaml"

configuration:
  - changed-files:
      - any-glob-to-any-file:
          - "next.config.ts"
          - "tsconfig.json"
          - "tsconfig.scripts.json"
          - "oxlint.config.ts"
          - "oxfmt.config.ts"
          - "postcss.config.mjs"
          - "knip.json"
          - "lefthook.yml"
          - "components.json"

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
          - "docs/**"
          - ".planning/**"
